<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presupuesto - A-R Servicios</title>
  <link href="css/styles.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="bg-primary text-white text-center py-3 fs-4 fw-bold shadow">
    A-R SERVICIOS — Sistema de Presupuestos
  </header>

  <div class="info-box">
  <div class="row align-items-center">
    <div class="col-md-6">
      <h5>Datos del Cliente</h5>
      <p><b>Cliente:</b> <input type="text" id="cliente" value="Claudio Guerreros" disabled></p>
      <p><b>Fundo:</b> <input type="text" id="fundo" value="Fundo La Victoria" disabled></p>
      <p><b>Correo:</b> <input type="email" id="correo" value="arservicios.spa56@gmail.com" disabled></p>
    </div>
    <div class="col-md-6 text-end">
      <h5>Datos de Empresa</h5>
      <p><b>Empresa:</b> <input type="text" id="empresa" value="A-R SERVICIOS" disabled></p>
      <p><b>Teléfonos:</b> <input type="text" id="telefonos" value="+56974073525 / +56991684044" disabled></p>
      <p><b>Fecha:</b> <span id="fecha"></span></p>
    </div>
  </div>

  <div class="text-center mt-3">
    <button id="btnEditar" class="btn btn-warning btn-sm" onclick="toggleEdicion()">✏️ Modificar Datos</button>
  </div>
</div>


    <h4 class="mt-4 mb-3">Servicios</h4>

    <table class="table table-bordered bg-white" id="tablaServicios">
      <thead class="table-primary text-center">
        <tr>
          <th>Descripción</th>
          <th>Unidad</th>
          <th>Cantidad</th>
          <th>Precio Unitario</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" class="form-control text-center" placeholder="Ej: Poda de árboles"></td>
          <td><input type="text" class="form-control text-center" placeholder="Unidad"></td>
          <td><input type="number" class="form-control text-center" min="0" value="0" oninput="calcularTotales()"></td>
          <td><input type="number" class="form-control text-center" min="0" value="0" oninput="calcularTotales()"></td>
          <td><input type="text" class="form-control text-center" readonly></td>
        </tr>
      </tbody>
    </table>

    <div class="d-flex gap-2 mb-3">
        <button class="btn btn-success btn-sm" onclick="agregarFila()">➕ Agregar Fila</button>
        <button class="btn btn-danger btn-sm" onclick="quitarFila()">➖ Quitar Fila</button>
    </div>


    <div class="mt-3 text-end fw-bold">
      <p>Valor Neto: $<span id="neto">0</span></p>
      <p>IVA (19%): $<span id="iva">0</span></p>
      <p>Valor Total: $<span id="total">0</span></p>
    </div>

    <div class="text-center mt-4 mb-5">
      <button class="btn btn-primary me-2" onclick="guardarPresupuesto()">💾 Guardar</button>
      <button class="btn btn-secondary me-2" onclick="cargarPresupuesto()">📂 Cargar</button>
      <button class="btn btn-danger me-2" onclick="borrarDatos()">🗑️ Borrar</button>
      <button class="btn btn-info text-white" onclick="descargarPDF()">⬇️ Descargar Presupuesto (PDF)</button>
    </div>
  </div>

  <!-- Librerías PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <script>
    document.getElementById("fecha").textContent = new Date().toLocaleDateString("es-CL");

    function agregarFila() {
      const tabla = document.querySelector("#tablaServicios tbody");
      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td><input type="text" class="form-control text-center" placeholder="Descripción"></td>
        <td><input type="text" class="form-control text-center" placeholder="Unidad"></td>
        <td><input type="number" class="form-control text-center" min="0" value="0" oninput="calcularTotales()"></td>
        <td><input type="number" class="form-control text-center" min="0" value="0" oninput="calcularTotales()"></td>
        <td><input type="text" class="form-control text-center" readonly></td>`;
      tabla.appendChild(fila);
    }
    function quitarFila() {
        const tabla = document.querySelector("#tablaServicios tbody");
        const filas = tabla.querySelectorAll("tr");

        if (filas.length > 1) {
            tabla.removeChild(filas[filas.length - 1]); // elimina la última fila
            calcularTotales();
        } else {
            alert("⚠️ No puedes eliminar todas las filas. Debe quedar al menos una.");
        }
    }


    function calcularTotales() {
      const filas = document.querySelectorAll("#tablaServicios tbody tr");
      let totalNeto = 0;
      filas.forEach(fila => {
        const c = fila.querySelectorAll("input");
        const cantidad = parseFloat(c[2].value) || 0;
        const precio = parseFloat(c[3].value) || 0;
        const subtotal = cantidad * precio;
        c[4].value = subtotal.toLocaleString("es-CL");
        totalNeto += subtotal;
      });
      const iva = totalNeto * 0.19;
      const total = totalNeto + iva;
      document.getElementById("neto").textContent = totalNeto.toLocaleString("es-CL");
      document.getElementById("iva").textContent = iva.toLocaleString("es-CL");
      document.getElementById("total").textContent = total.toLocaleString("es-CL");
    }

    function guardarPresupuesto() {
      const datos = [];
      document.querySelectorAll("#tablaServicios tbody tr").forEach(fila => {
        const c = fila.querySelectorAll("input");
        datos.push({
          desc: c[0].value,
          unidad: c[1].value,
          cantidad: c[2].value,
          precio: c[3].value
        });
      });
      localStorage.setItem("presupuesto", JSON.stringify(datos));
      alert("✅ Presupuesto guardado correctamente.");
    }

    function cargarPresupuesto() {
      const datos = JSON.parse(localStorage.getItem("presupuesto")) || [];
      const tbody = document.querySelector("#tablaServicios tbody");
      tbody.innerHTML = "";
      datos.forEach(d => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td><input type="text" class="form-control text-center" value="${d.desc}"></td>
          <td><input type="text" class="form-control text-center" value="${d.unidad}"></td>
          <td><input type="number" class="form-control text-center" value="${d.cantidad}" oninput="calcularTotales()"></td>
          <td><input type="number" class="form-control text-center" value="${d.precio}" oninput="calcularTotales()"></td>
          <td><input type="text" class="form-control text-center" readonly></td>`;
        tbody.appendChild(fila);
      });
      calcularTotales();
    }

    function borrarDatos() {
      if (confirm("¿Seguro que deseas borrar todos los datos guardados?")) {
        localStorage.removeItem("presupuesto");
        document.querySelector("#tablaServicios tbody").innerHTML = "";
        agregarFila();
        calcularTotales();
      }
    }

    // --- PDF ---
    let contador = parseInt(localStorage.getItem("contadorPDF")) || 1;
    function descargarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      if (typeof doc.autoTable !== "function") {
        alert("❌ No se pudo cargar el generador de PDF. Revisa conexión o abre con Live Server.");
        return;
      }

      doc.setFontSize(16);
      doc.text("Presupuesto A-R Servicios", 70, 15);
      doc.setFontSize(10);
      doc.text("Cliente: Claudio Guerreros", 10, 25);
      doc.text("Fundo: La Victoria", 10, 30);
      doc.text("Fecha: " + new Date().toLocaleDateString("es-CL"), 10, 35);

      const filas = document.querySelectorAll("#tablaServicios tbody tr");
      const data = [];
      filas.forEach(fila => {
        const c = fila.querySelectorAll("input");
        if (c[0].value || c[1].value || c[2].value) {
          data.push([c[0].value, c[1].value, c[2].value, c[3].value, c[4].value]);
        }
      });

      doc.autoTable({
        startY: 45,
        head: [["Descripción", "Unidad", "Cant.", "Precio", "Subtotal"]],
        body: data,
        theme: "grid"
      });

      const y = doc.lastAutoTable.finalY + 10;
      doc.text(`Valor Neto: $${document.getElementById("neto").textContent}`, 130, y);
      doc.text(`IVA (19%): $${document.getElementById("iva").textContent}`, 130, y + 5);
      doc.text(`Total: $${document.getElementById("total").textContent}`, 130, y + 10);

      const nombreArchivo = `presupuesto_${String(contador).padStart(3, "0")}.pdf`;
      localStorage.setItem("contadorPDF", contador + 1);
      contador++;
      doc.save(nombreArchivo);
    }
    function toggleEdicion() {
  const campos = document.querySelectorAll('#cliente, #fundo, #correo, #empresa, #telefonos');
  const boton = document.getElementById('btnEditar');
  const editando = campos[0].disabled === false;

  campos.forEach(campo => campo.disabled = editando);

  if (editando) {
    boton.textContent = "✏️ Modificar Datos";
    boton.classList.remove("btn-success");
    boton.classList.add("btn-warning");
    alert("✅ Datos guardados correctamente.");
    // Puedes guardar los datos en localStorage si quieres:
    localStorage.setItem("cliente", document.getElementById("cliente").value);
    localStorage.setItem("fundo", document.getElementById("fundo").value);
    localStorage.setItem("correo", document.getElementById("correo").value);
    localStorage.setItem("empresa", document.getElementById("empresa").value);
    localStorage.setItem("telefonos", document.getElementById("telefonos").value);
  } else {
    boton.textContent = "💾 Guardar Datos";
    boton.classList.remove("btn-warning");
    boton.classList.add("btn-success");
  }
}

// 🔁 Cargar datos guardados si existen
window.addEventListener("load", () => {
  if (localStorage.getItem("cliente")) document.getElementById("cliente").value = localStorage.getItem("cliente");
  if (localStorage.getItem("fundo")) document.getElementById("fundo").value = localStorage.getItem("fundo");
  if (localStorage.getItem("correo")) document.getElementById("correo").value = localStorage.getItem("correo");
  if (localStorage.getItem("empresa")) document.getElementById("empresa").value = localStorage.getItem("empresa");
  if (localStorage.getItem("telefonos")) document.getElementById("telefonos").value = localStorage.getItem("telefonos");
});

  </script>
</body>
</html>
