<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - A-R Servicios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

  <div class="card shadow p-4" style="width: 350px;">
    <h4 class="text-center mb-3">Crear Usuario</h4>

    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" id="user" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" id="pass" class="form-control">
    </div>

    <button class="btn btn-success w-100" onclick="registrar()">Registrar</button>

    <p class="text-center mt-3">
      <a href="login.html">Volver al Login</a>
    </p>
  </div>

  <script>
    function registrar() {
      const u = document.getElementById("user").value.trim();
      const p = document.getElementById("pass").value.trim();

      if (u === "" || p === "") {
        alert("⚠ Debes llenar todos los campos.");
        return;
      }

      let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      // Validar usuario existente
      const existe = usuarios.some(x => x.user === u);

      if (existe) {
        alert("❌ Ese usuario ya existe.");
        return;
      }

      // Guardar usuario nuevo
      usuarios.push({ user: u, pass: p });
      localStorage.setItem("usuarios", JSON.stringify(usuarios));

      alert("✅ Usuario creado correctamente.");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
