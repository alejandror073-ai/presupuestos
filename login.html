<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - A-R Servicios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

  <div class="card shadow p-4" style="width: 350px;">
    <h4 class="text-center mb-3">Iniciar Sesión</h4>

    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" id="user" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" id="pass" class="form-control">
    </div>

    <button class="btn btn-primary w-100" onclick="login()">Ingresar</button>

    <p class="text-center mt-3">
      <a href="register.html">Crear cuenta nueva</a>
    </p>
  </div>

  <script>
    function login() {
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;

      let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      // Comparar usuario/contraseña
      const encontrado = usuarios.find(x => x.user === u && x.pass === p);

      if (encontrado) {
        localStorage.setItem("usuarioLogeado", u);
        window.location.href = "index.html";
      } else {
        alert("❌ Usuario o contraseña incorrectos.");
      }
    }

    // Si ya está logeado, entrar directo
    if (localStorage.getItem("usuarioLogeado")) {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
